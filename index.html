<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sandpixels Engine v1.5</title>
    <style>
        body { 
            background: #1e1e1e; color: white; text-align: center; 
            font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 10px;
            user-select: none; -webkit-user-select: none;
        }
        .container { max-width: 600px; margin: 0 auto; }
        canvas { 
            background: #000; border: 4px solid #444; width: 100%; max-width: 400px;
            aspect-ratio: 1; image-rendering: pixelated; touch-action: none;
        }
        .menu-bar, .hotbar { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
        .btn {
            padding: 6px 12px; background: #444; border: 2px solid #666; color: white;
            cursor: pointer; font-weight: bold; border-radius: 4px; font-size: 12px;
        }
        .btn:hover { background: #555; }
        .slot {
            padding: 8px 12px; background: #333; border: 3px solid #555; color: #fff;
            cursor: pointer; font-weight: bold; border-radius: 4px; font-size: 11px; text-transform: uppercase;
        }
        .slot.selected { border-color: #55ff55; background: #224422; }
        .slot.boom { border-color: #ff5555; }
        .slot.boom.selected { background: #442222; }
        .slot.tool { border-color: #55aaff; }
        .slot.tool.selected { background: #223344; }
        .controles-player { margin-top: 5px; font-size: 13px; color: #aaa; }
    </style>
</head>
<body>
<div class="container">
    <h1>Sandpixels Engine v1.5</h1>
    
    <div class="menu-bar">
        <button class="btn" onclick="gerarMundoNovo()">🌍 Novo Mundo</button>
        <button class="btn" onclick="salvarMapa()">💾 Salvar</button>
        <button class="btn" onclick="carregarMapa()">📁 Carregar</button>
    </div>

    <div class="hotbar">
        <div class="slot selected" onclick="mudarElemento('sand', this)">Areia</div>
        <div class="slot" onclick="mudarElemento('dirt', this)">Terra</div>
        <div class="slot" onclick="mudarElemento('stone', this)">Pedra</div>
        <div class="slot" onclick="mudarElemento('water', this)">Água</div>
        <div class="slot" onclick="mudarElemento('lava', this)">Lava</div>
        <div class="slot" onclick="mudarElemento('fire', this)">Fogo</div>
        <div class="slot" onclick="mudarElemento('seed', this)">🌱 Semente</div>
        <div class="slot" onclick="mudarElemento('cloud', this)">☁️ Nuvem</div>
        <div class="slot boom" onclick="mudarElemento('tnt', this)">💥 TNT</div>
        <div class="slot tool" onclick="mudarElemento('player', this)">🧍 Jogador</div>
        <div class="slot tool" onclick="mudarElemento('eraser', this)">🧽 Apagar</div>
    </div>
    
    <canvas id="jogoCanvas" width="150" height="150"></canvas>
    <div class="controles-player">Controle o Jogador na tela usando as teclas: <b>A / W / D</b></div>
</div>

<script>
const canvas = document.getElementById("jogoCanvas");
const ctx = canvas.getContext("2d");
const LARGURA = canvas.width, ALTURA = canvas.height;

let mapa = Array(LARGURA).fill(null).map(() => Array(ALTURA).fill(null));
let partículas = [];
let elementoAtual = "sand";

// Estrutura do Jogador (Steve)
let jogador = { x: 75, y: 20, vx: 0, vy: 0, noChao: false, ativo: false };

const POWDER = "pó", SOLID = "sólido", LIQUID = "líquido", GAS = "gás", EXPLOSIVE = "tnt", CLOUD = "nuvem", SEED = "semente";

const SandpixelsElement = {
    sand: { behavior: POWDER, color: { r: 225, g: 195, b: 130 } },
    dirt: { behavior: POWDER, color: { r: 130, g: 85, b: 45 } },
    stone: { behavior: SOLID, color: { r: 120, g: 120, b: 120 } },
    water: { behavior: LIQUID, color: { r: 50, g: 130, b: 230 } },
    lava: { behavior: LIQUID, color: { r: 240, g: 100, b: 20 } },
    fire: { behavior: GAS, color: { r: 255, g: 90, b: 0 }, vida: 30 },
    tnt: { behavior: EXPLOSIVE, color: { r: 220, g: 40, b: 40 } },
    cloud: { behavior: CLOUD, color: { r: 220, g: 220, b: 240 } },
    seed: { behavior: SEED, color: { r: 100, g: 200, b: 60 } },
    plant: { behavior: SOLID, color: { r: 35, g: 155, b: 55 } },
    player: { behavior: "tool" },
    eraser: { behavior: "tool" }
};

// --- GERAÇÃO DE MUNDO ---
function gerarMundoNovo() {
    mapa = Array(LARGURA).fill(null).map(() => Array(ALTURA).fill(null));
    partículas = [];
    jogador.ativo = false;
    for(let x=0; x<LARGURA; x++) {
        let alturaTerreno = Math.floor(ALTURA * 0.6 + Math.sin(x * 0.08) * 8 + Math.cos(x * 0.03) * 4);
        for(let y=alturaTerreno; y<ALTURA; y++) {
            let tipo = (y > alturaTerreno + 15) ? "stone" : (y > alturaTerreno + 2) ? "dirt" : "sand";
            let pixel = { ...SandpixelsElement[tipo] };
            pixel.semente = Math.random() * 50;
            mapa[x][y] = pixel;
        }
    }
}

// --- SISTEMA DE PARTÍCULAS ---
function criarFumaça(x, y, cor) {
    for(let i=0; i<3; i++) {
        partículas.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 1.5, vy: -Math.random() * 1,
            vida: 20 + Math.random() * 20, cor: cor || "#666"
        });
    }
}

function criarExplosao(cX, cY, raio) {
    for(let x = cX - raio; x <= cX + raio; x++) {
        for(let y = cY - raio; y <= cY + raio; y++) {
            if(x >= 0 && x < LARGURA && y >= 0 && y < ALTURA) {
                if(Math.sqrt((x-cX)**2 + (y-cY)**2) <= raio) {
                    if(mapa[x][y] && mapa[x][y].behavior === EXPLOSIVE) {
                        mapa[x][y] = null;
                        criarExplosao(x, y, raio);
                    } else {
                        if(Math.random() < 0.2) mapa[x][y] = { ...SandpixelsElement.fire, semente: Math.random()*50, vida: 40 };
                        else mapa[x][y] = null;
                    }
                    if(Math.random() < 0.3) criarFumaça(x, y, "#999");
                }
            }
        }
    }
    // Dano ao jogador
    if(jogador.ativo && Math.sqrt((jogador.x-cX)**2 + (jogador.y-cY)**2) <= raio + 5) {
        jogador.ativo = false;
        criarExplosao(Math.floor(jogador.x), Math.floor(jogador.y), 6);
    }
}

// --- MOTOR FÍSICO ---
function atualizarFisica() {
    // 1. Atualizar partículas de fumaça
    for(let i=partículas.length-1; i>=0; i--) {
        let p = partículas[i];
        p.x += p.vx; p.y += p.vy; p.vida--;
        if(p.vida <= 0 || p.x < 0 || p.x >= LARGURA || p.y < 0 || p.y >= ALTURA) partículas.splice(i, 1);
    }

    // 2. Física do Jogador
    if(jogador.ativo) {
        jogador.vy += 0.2; // Gravidade
        jogador.x += jogador.vx;
        
        // Colisão X
        let px = Math.floor(jogador.x), py = Math.floor(jogador.y);
        if(px < 0 || px >= LARGURA || (mapa[px] && mapa[px][py] && mapa[px][py].behavior === SOLID)) jogador.x -= actor.vx;
        
        jogador.y += actor.vy;
        jogador.noChao = false;
        px = Math.floor(jogador.x); py = Math.floor(jogador.y);
        
        // Colisão Y (Chão)
        if(py >= ALTURA - 3) { jogador.y = ALTURA - 3; jogador.vy = 0; jogador.noChao = true; }
        else if(px >= 0 && px < LARGURA && py >= 0 && py < ALTURA && mapa[px][py+1] !== null) {
            let elementoAbaixo = mapa[px][py+1].behavior;
            if(elementoAbaixo === SOLID || elementoAbaixo === POWDER) {
                jogador.y = py; jogador.vy = 0; jogador.noChao = true;
            }
            if(mapa[px][py+1].baseColor === SandpixelsElement.lava.color) { // Morre na lava
                jogador.ativo = false; criarExplosao(px, py, 5);
            }
        }
    }

    // 3. Física dos Pixels (Varredura de baixo para cima)
    for(let y = ALTURA - 1; y >= 0; y--) {
        for(let x = 0; x < LARGURA; x++) {
            let pixel = mapa[x][y];
            if(!pixel) continue;

            // GRAVIDADE DE SÓLIDOS CAÍVEIS (Pó/Areia/Terra/TNT/Semente)
            if(pixel.behavior === POWDER || pixel.behavior === EXPLOSIVE || pixel.behavior === SEED) {
                if(pixel.behavior === EXPLOSIVE && mapa[x][y+1] !== null) {
                    mapa[x][y] = null; criarExplosao(x, y, 14); continue;
                }
                if(pixel.behavior === SEED && mapa[x][y+1] && mapa[x][y+1].behavior === POWDER) {
                    // Semente germina na terra úmida/normal
                    if(Math.random() < 0.05) { pixel.behavior = SOLID; pixel.color = {r:35, g:155, b:55}; }
                }
                if(y < ALTURA-1 && mapa[x][y+1] === null) { mapa[x][y+1] = pixel; mapa[x][y] = null; }
                else if(y < ALTURA-1 && x > 0 && mapa[x-1][y+1] === null) { mapa[x-1][y+1] = pixel; mapa[x][y] = null; }
                else if(y < ALTURA-1 && x < LARGURA-1 && mapa[x+1][y+1] === null) { mapa[x+1][y+1] = pixel; mapa[x][y] = null; }
            }
            
            // FÍSICA DOS LÍQUIDOS (Água e Lava)
            else if(pixel.behavior === LIQUID) {
                // Reação Lava + Água = Pedra
                if(y < ALTURA-1 && mapa[x][y+1] && ((pixel.color.r > 200 && mapa[x][y+1].color.b > 200) || (pixel.color.b > 200 && mapa[x][y+1].color.r > 200))) {
                    mapa[x][y] = { ...SandpixelsElement.stone, semente: Math.random()*20 };
                    mapa[x][y+1] = { ...SandpixelsElement.stone, semente: Math.random()*20 };
                    continue;
                }
                if(y < ALTURA-1 && mapa[x][y+1] === null) { mapa[x][y+1] = pixel; mapa[x][y] = null; }
                else if(y < ALTURA-1 && x > 0 && mapa[x-1][y+1] === null) { mapa[x-1][y+1] = pixel; mapa[x][y] = null; }
                else if(y < ALTURA-1 && x < LARGURA-1 && mapa[x+1][y+1] === null) { mapa[x+1][y+1] = pixel; mapa[x][y] = null; }
                else if(x > 0 && mapa[x-1][y] === null && Math.random() < 0.6) { mapa[x-1][y] = pixel; mapa[x][y] = null; }
